name: API SIDRA IBGE - IPCA FECHADO

on:
  schedule:
    - cron: '0 16 * * *' # Executa todos os dias às 16h (UTC) - # minuto hora dia mês dia-da-semana

  workflow_dispatch: # Permite execução manual do workflow

jobs:
  executar-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v2

      - name: Configurar Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Atualiza Lista de Produtos
        run: |
          python func_list_prod.py

      - name: Resultado IPCA Fechado
        run: |
          python IPCA.py 